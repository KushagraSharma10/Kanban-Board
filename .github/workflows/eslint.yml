name: Lint

on:
  pull_request:
    branches: [dev, stage, main]
    paths-ignore:
      - '**/*.md'
      - 'public/**'
      - 'assets/**'
  push:
    branches:
      - '**'         
    paths-ignore:
      - '**/*.md'
      - 'public/**'
      - 'assets/**'

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint:ci   
